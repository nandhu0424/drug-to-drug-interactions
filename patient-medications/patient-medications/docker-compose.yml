version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: drug_analyzer_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml-service:
    build:
      context: ./ml-model
    container_name: drug_analyzer_ml
    restart: always
    ports:
      - "5001:5001"

  backend:
    build:
      context: ./backend
    container_name: drug_analyzer_backend
    restart: always
    ports:
      - "5005:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/PatientMedications
      - ML_SERVICE_URL=http://ml-service:5001
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
      - ml-service

  frontend:
    build:
      context: ./frontend
    container_name: drug_analyzer_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:

